# gradle.properties for ClariHear 2.0 Android

# ── React Native New Architecture ──────────────────────────────────────────────
# CRITICAL: This enables Fabric (new renderer) + TurboModules (JSI)
# Must be true for our JSI audio parameter bindings to work
newArchEnabled=true

# ── Hermes JS Engine ───────────────────────────────────────────────────────────
# Required for New Architecture (JSI is implemented in Hermes)
hermesEnabled=true

# ── Build performance ──────────────────────────────────────────────────────────
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true

# ── NDK version ────────────────────────────────────────────────────────────────
# Must match the version used to compile Oboe's Prefab AAR
# Check: https://github.com/google/oboe/releases
android.ndkVersion=26.1.10909125
